<!DOCTYPE html dir="ltr">
<!-- Hugo inyecta de forma 100% nativa el código del idioma actual (gl, es o en) -->
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    
    {{ with .Params.description }}
    <meta name="description" content="{{ . }}">
    {{ else }}
    <meta name="description" content="{{ .Site.Params.description }}">
    {{ end }}

    <!-- [OPCIONAL pero recomendado] Precomentar a Copilot: Si en tu fonts.css cargas, por ejemplo, Inter-Regular.woff2, pon la línea aquí abajo para que la fuente cargue antes que nada y evites el parpadeo del texto (CLS) -->
    <!-- <link rel="preload" href="/fonts/inter-v20-latin-regular.woff2" as="font" type="font/woff2" crossorigin> -->

    <!-- Cargamos los estilos -->
    <link rel="stylesheet" href="/css/fonts.css">
    <!-- Carga no bloqueante del CSS de Swiper -->
<link rel="stylesheet" href="/css/swiper-bundle.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/css/swiper-bundle.min.css"></noscript>


    <!-- SOLUCIÓN PERFORMANCE: Añadimos "defer" para que Master CSS se ejecute en paralelo sin bloquear el pintado inicial de la pantalla -->
    <script defer src="https://cdn.master.co/css@1.37.8"></script>

    <!-- icon -->
    <link rel="icon" href="/img/simbolo_paisaxe.webp" type="image/x-icon">
</head>
<body class="font-family:sans f:14 f:17@lg color:sky-26 lh:1.5 m:0 p:0">

    <!-- Incluimos el componente Navbar pasándole el contexto global (.) -->
    {{ partial "navbar.html" . }}

    <!-- Contenedor principal semántico de Pico.css -->
    <main class="container">
        {{ block "main" . }}{{ end }}
    </main>

    <!-- Incluimos el componente Footer -->
    {{ partial "footer.html" . }}

    <!-- Inyector Local del Editor Visual (Activado solo mediante npm run editor) -->
    {{ if getenv "HUGO_EDITOR" }}
       {{ partial "editor.html" . }}
    {{ end }}

<script src="/js/swiper-bundle.min.js"></script>
<script>
  window.addEventListener('load', function() {
    const swiperContainer = document.querySelector('.mySwiper');
    
    if (swiperContainer) {
      var swiper = new Swiper(".mySwiper", {
        initialSlide: 0,
        slidesPerView: "auto",
        centeredSlides: true,
        spaceBetween: 25,
        watchOverflow: false,
        observer: true,
        observeParents: true,
        navigation: {
          nextEl: ".boton-siguiente",
          prevEl: ".boton-anterior",
        },
      });

      // Añade la clase para mostrar el carrusel de forma suave
      swiperContainer.classList.add('is-ready');
    }
  });
</script>




</body>
</html>
